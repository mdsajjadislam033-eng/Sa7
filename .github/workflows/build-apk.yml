name: Build Sa7 Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Sa7 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Configure and Add Capacitor Android
        run: |
          # যদি capacitor.config ফাইল না থাকে, তবে একটি তৈরি করবে
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.sa7.app", "appName": "Sa7", "webDir": "dist"}' > capacitor.config.json
          fi
          
          # পুরনো অ্যান্ড্রয়েড ফোল্ডার থাকলে তা মুছে নতুন করে তৈরি করবে
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Sa7 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sa7-v1.0.apk

      - name: Upload Sa7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sa7-Android-APK
          path: Sa7-v1.0.apk
          retention-days: 90
          
